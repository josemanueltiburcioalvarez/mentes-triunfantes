<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Sin conexión · Mentes Triunfantes</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #f4f4f5;
        background: radial-gradient(ellipse at 50% 30%, rgba(16, 185, 129, 0.18), transparent 60%), #0a0a0a;
      }
      img { width: 120px; height: auto; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 0; max-width: 320px; color: #a1a1aa; font-size: 15px; line-height: 1.5; }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: #10b981;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/logo-emblema-blanco.png" alt="Mentes Triunfantes" />
    <h1>Sin conexión</h1>
    <p>No hay internet en este momento. Revisa tu conexión y vuelve a intentarlo: tu progreso está guardado.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </body>
</html>
